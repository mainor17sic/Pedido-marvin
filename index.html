<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        /* Animation styles */
        @keyframes fadeIn {
            0% { opacity: 0; }
            100% { opacity: 1; }
        }
        .fade-in {
            animation: fadeIn 1s ease-in;
        }
        @keyframes slideIn {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(0); }
        }
        .slide-in {
            animation: slideIn 1s ease-out;
        }
    </style>
</head>
<body>
    <div class="fade-in">
        <h1>Welcome to Pedido Marvin!</h1>
    </div>
    <div class="slide-in">
        <p>This is a sample paragraph with animation.</p>
    </div>
    <!-- Existing HTML structure continues here -->
    <script>
        // Existing JavaScript if any
    </script>
</body>
</html>
